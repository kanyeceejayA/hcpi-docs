site_name: HCPI Documentation
site_url: https://kanyeceejaya.github.io/hcpi-docs/
site_description: Documentation for the HCPI (Cost Price Index) system
site_author: HCPI Team

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started:
    - Prerequisites: getting-started/prerequisites.md
    - Getting the Code: getting-started/getting-the-code.md
    - Git Remotes (EAC): getting-started/git-remotes.md
  - Exporting:
    - From a Linux Server: extraction/linux-export.md
  - Installation:
    - Windows WSL: installation/windows-wsl.md
    - Windows Native: installation/windows-native.md
    - Linux Server: installation/linux.md
  - Concepts:
    - CPI Explained: concepts/cpi-explained.md
    - CPI Concepts: concepts/cpi-concepts.md
    - Data Flow Walkthrough: concepts/data-flow.md
    - Glossary: concepts/glossary.md
  - Working with the Code:
    - Odoo Basics: understanding-the-codebase/odoo-basics.md
    - Understanding the Codebase: understanding-the-codebase/index.md
    - Module Reference: understanding-the-codebase/module-reference.md
    - Country Variants: understanding-the-codebase/country-variants.md
    - Making Your First Edits: first-edits/index.md
    - Your First Module: first-edits/your-first-module.md
  - Troubleshooting: troubleshooting.md
  - Next Steps:
    - Overview: next-steps/index.md
    - HTTPS with Apache: next-steps/https-apache.md
    - HTTPS with Nginx: next-steps/https-nginx.md
  - Training:
    - Overview: training/index.md
    - "Day 1 – Setup & Foundations":
      - Introduction to HCPI: training/day1/introduction.md
      - Server Setup: training/day1/server-setup.md
      - Installing Dependencies: training/day1/dependencies.md
      - PostgreSQL Setup: training/day1/postgresql.md
      - Virtual Environment & HCPI Install: training/day1/virtualenv-install.md
      - Development Environment: training/day1/dev-environment.md
      - Configuration File: training/day1/configuration.md
      - User Administration: training/day1/user-administration.md
    - "Day 2 – Python & First Module":
      - Python for HCPI: training/day2/python-intro.md
    - "Days 3-5 – Building a Real Module":
      - "Part 1: Models, Fields, Relationships": training/module/part1-models.md
      - "Part 2: Views & UX": training/module/part2-views.md
      - "Part 3: Security & Polish": training/module/part3-security.md
  - About: about.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
